name: Build and Deploy documentation site

on:
 push:
  branches: [main]
 pull_request:
  branches: [main]

permissions:
 contents: read

# one deployment at a time; a run in progress finishes before the next starts.
concurrency:
 group: pages-${{ github.event_name }}-${{ github.ref }}
 cancel-in-progress: false

jobs:
 build-docs:
  runs-on: ubuntu-latest
  timeout-minutes: 30

  steps:
   - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
     with:
      persist-credentials: false

   - name: Setup .NET
     uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
     with:
      dotnet-version: 10.0

   # the API metadata is read from both projects, so their packages, Avalonia's among them, are restored first.
   - name: Restore
     run: dotnet restore RDCore.Forms.slnx

   - name: Install DocFX
     run: dotnet tool update -g docfx

   # a pull request fails on a broken link or cross-reference; main publishes what it builds.
   - name: Build Docs (pull request)
     if: github.event_name == 'pull_request'
     run: docfx docs/docfx.json --warningsAsErrors

   - name: Build Docs
     if: github.event_name == 'push'
     run: docfx docs/docfx.json

   - name: Upload Site
     if: github.event_name == 'push'
     uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
     with:
      path: docs/_site

 deploy:
  if: github.event_name == 'push'
  needs: build-docs
  runs-on: ubuntu-latest
  permissions:
   pages: write
   id-token: write
  environment:
   name: github-pages
   url: ${{ steps.deployment.outputs.page_url }}
  steps:
   - id: deployment
     uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
